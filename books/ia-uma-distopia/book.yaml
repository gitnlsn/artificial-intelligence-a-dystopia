cover_guides: false   # true só enquanto a capa está sendo desenhada

print:
  # 5,5 x 8,5 pol é o formato usual de romance na KDP; o Manual da Vida usa
  # 6 x 9, que é formato de não ficção. Mudar aqui muda a lombada sozinho.
  trim: [5.5in, 8.5in]
  paper: cream           # cream | white -- muda a largura da lombada
  interior: bw           # bw | color -- bw exige imagens em escala de cinza
  bleed: false           # true só se a arte sangrar até a borda
  font_size: 11pt
  leading: 0.78em
  outer_margin: 0.6in
  top_margin: 0.7in
  bottom_margin: 0.75in
  gutter_extra: 0.35in   # somado ao mínimo exigido pela KDP
  illustration_width: 0.74   # fração da largura da caixa de texto

epub:
  cover: cover.png             # em illustrations/masters/
  illustration_format: jpg     # png para traço, jpg para arte fotográfica
  illustration_max_px: 1400
