# Texto do anúncio na KDP, versionado junto do manuscrito.
kdp:
  description: |
    Numa cidade que não é nomeada, faltam dez dias para o desfile.

    Aurel tem oitenta e dois anos e foi revisor de jornal. Passou a vida
    conferindo se o que estava escrito correspondia ao mundo, e agora não
    consegue dizer em voz alta que época da história é hoje.

    Rita é cuidadora. Entra numa casa diferente a cada turno, e os turnos vêm
    rareando sem que ninguém tenha decidido nada contra ela.

    Voss revisa exceções. Veio de baixo e subiu porque uma vez, aos dezessete
    anos, o critério ganhou do favor — e é por isso que acredita.

    Nina tem nove anos e não perdeu nada, porque não havia o que perder.

    Nenhum dos quatro conhece os outros. No sábado, os quatro vão estar na
    mesma calçada, ao mesmo tempo, ouvindo a banda de uma escola tocar mal uma
    música que ninguém reconhece.

    Ninguém é punido neste livro. Tudo está correto, todo mundo é educado, e o
    prazo para se manifestar é de quarenta dias úteis.
  keywords:
    - ficção científica
    - distopia
    - inteligência artificial
    - ficção literária
    - burocracia
    - romance contemporâneo
    - tecnologia e sociedade
  categories:
    - Ficção > Ficção Científica > Distopia
    - Ficção > Ficção Literária
    - Ficção > Thriller e Suspense
  age_range: adulto
  price_usd: 12.99

