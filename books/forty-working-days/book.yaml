kdp:
  description: |
    In a city that is never named, the parade is ten days away.

    Aurel is eighty-two and was a newspaper reviser. He spent his life checking
    whether what was written matched the world, and now he cannot say out loud
    what period of history this is.

    Rita is a caregiver. She walks into a different house every shift, and the
    shifts have been getting fewer without anyone deciding anything against
    her.

    Voss reviews exceptions. He came from the bottom and rose because once, at
    seventeen, the criteria beat a favor — and that is why he believes.

    Nina is nine and has lost nothing, because there was nothing to lose.

    None of the four knows the others. On Saturday all four will be on the same
    sidewalk, at the same moment, listening to a school band play badly a piece
    of music nobody recognizes.

    Nobody is punished in this book. Everything is correct, everyone is polite,
    and the period for a response is forty working days.
